# ==========================================================================
# L'Escale — configuration nginx durcie (server block).
# Montée dans /etc/nginx/conf.d/default.conf sur l'image nginx-unprivileged
# (tourne en utilisateur non-root, écoute sur 8080).
#
# NOTE nginx : un `add_header` placé dans un bloc `location` REMPLACE tous les
# add_header hérités. On garde donc TOUS les add_header au niveau `server` et
# on gère le cache via la variable $es_cache (map) — aucun add_header en
# location, pour ne jamais perdre les en-têtes de sécurité.
# ==========================================================================

# Cache : seuls les assets fingerprintés par Vite (/assets/, statut 200) sont
# immutables. Images/polices non hashées de /public et toute erreur : no-cache.
map "$status:$uri" $es_cache {
    default                 "no-cache";
    ~^200:/assets/          "public, max-age=31536000, immutable";
}

server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # --- Durcissement général ---------------------------------------------
    server_tokens off;
    absolute_redirect off;
    charset utf-8;

    client_max_body_size 1m;
    client_body_timeout   10s;
    client_header_timeout 10s;

    # Site statique : seules GET/HEAD ont un sens.
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    # --- En-têtes de sécurité (niveau server → hérités partout) ------------
    # NB : le hash sha256 autorise UNIQUEMENT le bloc JSON-LD statique de
    # index.html (données structurées SEO). Si tu modifies ce bloc, recalcule
    # le hash : voir README (« Données structurées »).
    set $csp "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https://images.unsplash.com; connect-src 'self'; manifest-src 'self'; upgrade-insecure-requests";

    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-XSS-Protection "0" always;
    # HSTS : effectif derrière le TLS de Dokploy/Traefik (HTTPS).
    # Sans includeSubDomains/preload : à n'activer qu'après avoir confirmé la maîtrise
    # de tous les sous-domaines du domaine de production.
    add_header Strict-Transport-Security "max-age=31536000" always;
    # Site de démonstration : non indexable.
    add_header X-Robots-Tag "noindex, nofollow" always;
    # Cache piloté par le type de contenu (voir map ci-dessus).
    add_header Cache-Control $es_cache always;

    # --- Compression -------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

    # --- Endpoint de santé pour Dokploy -----------------------------------
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # --- Refus des fichiers cachés (.env, .git, etc.) ----------------------
    location ~ /\. {
        deny all;
    }

    # --- Assets fingerprintés ---------------------------------------------
    location /assets/ {
        try_files $uri =404;
    }

    # --- SPA fallback ------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ============================================================
#  En-têtes de sécurité — fichier inclus, et non hérité.
#
#  Piège nginx : dès qu'un bloc `location` contient un `add_header`,
#  TOUS les `add_header` du bloc parent sont ignorés pour ce bloc.
#  D'où ce fichier, ré-inclus explicitement dans chaque location
#  qui pose ses propres en-têtes.
# ============================================================

add_header X-Content-Type-Options "nosniff"                          always;
add_header X-Frame-Options        "DENY"                             always;
add_header Referrer-Policy        "strict-origin-when-cross-origin"  always;
add_header Permissions-Policy     "geolocation=(), microphone=(), camera=()" always;

# Politique de contenu, calée sur ce que le site charge réellement :
#   - polices : fonts.googleapis.com (CSS) + fonts.gstatic.com (fichiers)
#   - images  : cf.bstatic.com (photos Booking)
#   - styles  : 'unsafe-inline' indispensable, la page utilise beaucoup
#               d'attributs style= (dégradés, délais d'animation).
# Tout service externe ajouté plus tard (analytics, carte…) doit être
# autorisé ici, sinon le navigateur le bloquera silencieusement.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://cf.bstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

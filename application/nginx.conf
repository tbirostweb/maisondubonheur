# ============================================================
#  Maison du Bonheur — configuration nginx
# ============================================================

server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    server_tokens off;

    # ---------- Compression ----------
    gzip              on;
    gzip_vary         on;
    gzip_min_length   256;
    gzip_comp_level   6;
    gzip_types        text/plain text/css text/xml application/javascript
                      application/json application/xml image/svg+xml
                      application/manifest+json;

    include /etc/nginx/security-headers.conf;

    # Site statique : seules GET/HEAD ont un sens (405 sinon).
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }
    client_max_body_size  1k;
    client_body_timeout   10s;
    client_header_timeout 10s;
    send_timeout          10s;

    # ---------- Fichiers cachés (.env, .git…) ----------
    # 404 plutôt que 403 : inutile de confirmer à un scanner que le chemin
    # existe. Les logs en montrent des dizaines de tentatives par jour.
    location ~ /\. {
        return 404;
    }

    # ---------- Ressources compilées ----------
    # Vite met une empreinte dans le nom (index-CH_vO9T2.js) : le contenu
    # ne change jamais pour une même URL, on peut donc cacher un an.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        # Pas de « always » : une 404 ne doit jamais être cachée un an.
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ---------- La page ----------
    # index.html n'est jamais mis en cache : sinon un visiteur qui revient
    # continuerait de charger les anciennes ressources après un déploiement.
    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location / {
        # Le site est une page unique à ancres, sans routeur : une URL
        # inconnue doit répondre 404, pas servir index.html avec un 200.
        #
        # ► Si vous ajoutez un jour Vue Router en mode history, remplacez
        #   la ligne suivante par :  try_files $uri $uri/ /index.html;
        try_files $uri $uri/ =404;
    }

    # Vraie page 404 (statut 404 conservé, pas de repli sur la home).
    error_page 404 /404.html;
    location = /404.html {
        internal;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
}

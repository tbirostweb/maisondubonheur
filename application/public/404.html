<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Page introuvable — Maison du Bonheur</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<style>
  :root{--papier:#FFFCF7;--encre:#3B2A1B;--encre2:#7C6450;--orange:#A34208}
  *{box-sizing:border-box;margin:0}
  body{background:var(--papier);color:var(--encre);font:400 1rem/1.65 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;display:grid;place-items:center;padding:2rem 1.5rem}
  main{max-width:46ch;text-align:left}
  .surtitre{font-size:.75rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--orange)}
  h1{font-size:clamp(1.9rem,5vw,2.6rem);line-height:1.1;letter-spacing:-.02em;margin:.5rem 0 1rem}
  p{color:var(--encre2);margin-bottom:1.5rem}
  a{display:inline-block;background:var(--orange);color:#fff;font-weight:600;padding:.8rem 1.4rem;text-decoration:none}
  a:hover,a:focus-visible{outline:3px solid var(--encre);outline-offset:2px}
</style>
</head>
<body>
<main>
  <p class="surtitre" style="margin-bottom:0">Erreur 404</p>
  <h1>Cette page n’existe pas.</h1>
  <p>Le lien est peut-être erroné ou la page a été déplacée. Retrouvez nos deux appartements à Troyes et Sainte-Savine sur la page d’accueil.</p>
  <a href="/">Retour à l’accueil</a>
</main>
</body>
</html>
